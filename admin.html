<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Elite - GadgetStore Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050811;
            --card-bg: #0d1322;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        @keyframes cyberGlow {
            0% { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.25), inset 0 0 15px rgba(255, 0, 85, 0.1); }
            33% { border-color: #00f0ff; box-shadow: 0 0 25px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1); }
            66% { border-color: #7000ff; box-shadow: 0 0 25px rgba(112, 0, 255, 0.25), inset 0 0 15px rgba(112, 0, 255, 0.1); }
            100% { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.25), inset 0 0 15px rgba(255, 0, 85, 0.1); }
        }

        @keyframes cyberText {
            0% { color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.5); }
            33% { color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
            66% { color: #b537ff; text-shadow: 0 0 10px rgba(181,55,255,0.5); }
            100% { color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.5); }
        }

        body { background-color: var(--bg); color: var(--text); padding: 30px 20px; line-height: 1.6; }
        
        .login-wrapper, .dashboard-wrapper { 
            max-width: 1050px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 24px; 
            border: 2px solid #1e293b;
            animation: cyberGlow 8s infinite;
        }
        
        h2 { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        h2 span { animation: cyberText 8s infinite; }
        h3 { font-size: 1.35rem; font-weight: 700; color: #f9fafb; margin-bottom: 20px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }
        @media(max-width: 768px) { .form-group.full { grid-column: span 1; } }
        
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
        input, textarea, select { width: 100%; padding: 14px 18px; border: 1.5px solid var(--border); border-radius: 14px; font-size: 0.95rem; outline: none; background: #02040a; color: #fff; transition: all 0.3s ease; }
        input:focus, textarea:focus, select:focus { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        input[type="file"] { padding: 10px; cursor: pointer; color: var(--text-muted); background: #02040a; }
        
        .btn { 
            background: linear-gradient(135deg, #7000ff 0%, #ff0055 100%); color: white; border: none; padding: 14px 28px; border-radius: 14px; font-weight: 700; cursor: pointer; 
            transition: all 0.3s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(0, 240, 255, 0.7); }
        .btn-danger { background: linear-gradient(135deg, #f43f5e 0%, #7000ff 100%); box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
        
        .hidden { display: none !important; }
        
        .table-container { overflow-x: auto; margin-top: 20px; border-radius: 16px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; background: #0d1322; }
        th, td { padding: 18px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
        th { background-color: #02040a; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        tr:hover td { background-color: rgba(0, 240, 255, 0.02); }
        
        .badge { display: inline-block; padding: 6px 14px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; background: rgba(0, 240, 255, 0.12); color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.4); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    </style>
</head>
<body>

    <div id="loginSection" class="login-wrapper" style="max-width: 440px; margin-top: 80px;">
        <h2>🔐 <span>Admin Cyber Portal</span></h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">Otorisasi diperlukan untuk masuk ke sistem.</p>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="admin">
        </div>
        <button class="btn" style="width: 100%; margin-top: 10px;" onclick="loginAdmin()">Masuk Dashboard</button>
    </div>

    <div id="dashboardSection" class="dashboard-wrapper hidden">
        <div class="top-bar">
            <h2>⚡ <span>Panel Administrator Elite</span></h2>
            <button class="btn btn-danger" onclick="logoutAdmin()">Logout</button>
        </div>

        <h3>📦 Upload Produk Baru (Foto & Video Langsung)</h3>
        <form id="uploadForm" onsubmit="uploadProduk(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Barang</label>
                    <input type="text" id="namaBarang" placeholder="Contoh: Laptop Gaming Cyber" required>
                </div>
                <div class="form-group">
                    <label>Harga Produk</label>
                    <input type="text" id="hargaBarang" placeholder="Contoh: Rp 18.500.000" required>
                </div>
                <div class="form-group full">
                    <label>Deskripsi Detail</label>
                    <textarea id="descBarang" rows="3" placeholder="Spesifikasi lengkap..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Upload File Foto Produk</label>
                    <input type="file" id="fileFoto" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Upload File Video Produk</label>
                    <input type="file" id="fileVideo" accept="video/*" required>
                </div>
            </div>
            <button type="submit" class="btn">Publikasikan Produk</button>
        </form>

        <h3 style="margin-top: 45px;">📋 Daftar Pesanan Masuk Pelanggan</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Pemesan</th>
                        <th>Kontak (WA & Email)</th>
                        <th>Lokasi Alamat</th>
                        <th>Barang</th>
                        <th>Status Pengiriman</th>
                        <th>Ubah Status</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody">
                    <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Belum ada pesanan masuk.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loginAdmin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'admin' && p === 'admin') {
                localStorage.setItem('isAdminLoggedIn', 'true');
                checkAuth();
            } else {
                alert('Username atau Password salah! (admin / admin)');
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdminLoggedIn');
            checkAuth();
        }

        function checkAuth() {
            if(localStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadOrders();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
            }
        }

        function uploadProduk(e) {
            e.preventDefault();
            const fotoInput = document.getElementById('fileFoto');
            const videoInput = document.getElementById('fileVideo');

            if(fotoInput.files && fotoInput.files[0] && videoInput.files && videoInput.files[0]) {
                const readerFoto = new FileReader();
                const readerVideo = new FileReader();

                readerFoto.onload = function(eFoto) {
                    readerVideo.onload = function(eVideo) {
                        let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
                        const newProd = {
                            id: Date.now(),
                            name: document.getElementById('namaBarang').value,
                            price: document.getElementById('hargaBarang').value,
                            desc: document.getElementById('descBarang').value,
                            image: eFoto.target.result,
                            video: eVideo.target.result,
                            comments: []
                        };
                        products.push(newProd);
                        localStorage.setItem('storeProducts', JSON.stringify(products));
                        alert('Sukses! Produk berhasil diupload dengan foto & video langsung.');
                        document.getElementById('uploadForm').reset();
                    }
                    readerVideo.readAsDataURL(videoInput.files[0]);
                }
                readerFoto.readAsDataURL(fotoInput.files[0]);
            }
        }

        function loadOrders() {
            const tbody = document.getElementById('orderTableBody');
            let orders = JSON.parse(localStorage.getItem('storeOrders')) || [];
            tbody.innerHTML = '';

            if(orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Belum ada pesanan masuk.</td></tr>`;
                return;
            }

            orders.forEach((ord, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${ord.namaPemesan}</b></td>
                        <td>📱 ${ord.wa}<br>✉️ ${ord.email}</td>
                        <td>📍 ${ord.lokasi}</td>
                        <td>${ord.items}</td>
                        <td><span class="badge">${ord.status}</span></td>
                        <td>
                            <select onchange="updateStatus(${idx}, this.value)">
                                <option value="Sedang dikemas" ${ord.status=='Sedang dikemas'?'selected':''}>Sedang dikemas</option>
                                <option value="Lagi dikirim" ${ord.status=='Lagi dikirim'?'selected':''}>Lagi dikirim</option>
                                <option value="Selesai" ${ord.status=='Selesai'?'selected':''}>Selesai</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        }

        function updateStatus(index, newStatus) {
            let orders = JSON.parse(localStorage.getItem('storeOrders')) || [];
            orders[index].status = newStatus;
            localStorage.setItem('storeOrders', JSON.stringify(orders));
            alert('Status pengiriman berhasil diperbarui!');
            loadOrders();
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
